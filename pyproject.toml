[build-system]
requires = ["setuptools>=61.0", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peteos"
version = "0.3.2-post"
description = "Agentic application framework"
requires-python = ">=3.10"
dependencies = [
    "json5>=0.15.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "setuptools", "cython>=3.0"]
camera = ["opencv-python>=4.8.0", "numpy>=1.24.0"]
web = ["beautifulsoup4", "lxml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "oap: OAP benchmarks that require a live LLM backend",
]

